<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Question - QueueOverflow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .editor-container {
            margin-top: 1rem;
        }

        /* Toolbar Fixes */
        .editor-toolbar {
            background-color: #f9f9f9 !important;
            border-color: #ccc !important;
            opacity: 1 !important;
        }

        .editor-toolbar i {
            color: #555 !important;
        }

        .editor-toolbar a {
            color: #555 !important;
        }

        .editor-toolbar a:hover,
        .editor-toolbar a.active {
            background-color: #e0e0e0 !important;
            border-color: #bbb !important;
        }

        /* 60/40 Split View & Dark Mode */
        .EasyMDEContainer .CodeMirror {
            width: 60% !important;
            min-height: 500px;
            background-color: #1e1e1e;
            /* Dark Editor */
            color: #e0e0e0;
            border-color: #444;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left: 1px solid #fff;
        }

        .EasyMDEContainer .editor-preview-side {
            width: 40% !important;
            border-left: 1px solid #444;
            display: block !important;
            position: static !important;
            height: auto !important;
            min-height: 500px;
            background-color: #000000 !important;
            /* Black Preview Background */
            color: #ffffff !important;
            /* White Preview Text */
            padding: 1rem;
        }

        /* Preview Content Styling */
        .editor-preview-side h1,
        .editor-preview-side h2,
        .editor-preview-side h3 {
            color: #ffffff !important;
            border-bottom: 1px solid #444;
        }

        .editor-preview-side a {
            color: #64b5f6 !important;
        }

        .editor-preview-side pre {
            background: #2d2d2d !important;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .editor-preview-side code {
            background: #2d2d2d !important;
            color: #e0e0e0 !important;
        }

        .editor-preview-side ul,
        .editor-preview-side ol {
            padding-left: 2rem !important;
        }

        /* Ensure container flexes */
        .EasyMDEContainer {
            display: flex;
            flex-wrap: wrap;
        }

        /* Fix toolbar width */
        .editor-toolbar {
            width: 100% !important;
            border-radius: 4px 4px 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">QueueOverflow</a>
            <div class="user-info">
                <span id="user-display" class="user-badge">Guest</span>
                <a href="/create_post.html" class="btn btn-secondary" style="margin-right: 0.5rem;">Create Post</a>
            </div>
        </header>

        <main>
            <h2 style="margin-bottom: 2rem;">Ask a Public Question</h2>

            <form id="ask-form" class="card">
                <div class="form-group">
                    <label>Title <span style="color:var(--error)">*</span></label>
                    <input type="text" name="title" placeholder="e.g. Payment API returns 500 on checkout" required>
                    <small style="color:var(--text-secondary)">Be specific and imagine you're asking a question to
                        another person.</small>
                </div>

                <div class="form-group">
                    <label>Description <span style="color:var(--error)">*</span></label>
                    <textarea id="description-editor" name="content"></textarea>
                    <small style="color:var(--text-secondary)">Include all the information someone would need to answer
                        your question.</small>
                </div>

                <div class="form-group">
                    <label>Tags</label>
                    <input type="text" name="tags" placeholder="e.g. java, spring-boot, error-500">
                </div>

                <div class="form-group">
                    <label>Attachment (Image)</label>
                    <input type="file" name="image" accept="image/*">
                </div>

                <button type="submit" class="btn btn-primary">Post Question</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
