<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - QueueOverflow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        .editor-container {
            margin-top: 1rem;
        }

        /* Toolbar Fixes */
        .editor-toolbar {
            background-color: #f9f9f9 !important;
            border-color: #ccc !important;
            opacity: 1 !important;
        }

        .editor-toolbar i {
            color: #555 !important;
        }

        .editor-toolbar a {
            color: #555 !important;
        }

        .editor-toolbar a:hover,
        .editor-toolbar a.active {
            background-color: #e0e0e0 !important;
            border-color: #bbb !important;
        }

        /* 60/40 Split View & Dark Mode */
        .EasyMDEContainer .CodeMirror {
            width: 60% !important;
            min-height: 500px;
            background-color: #1e1e1e;
            /* Dark Editor */
            color: #e0e0e0;
            border-color: #444;
        }

        .EasyMDEContainer .CodeMirror-cursor {
            border-left: 1px solid #fff;
        }

        .EasyMDEContainer .editor-preview-side {
            width: 40% !important;
            border-left: 1px solid #444;
            display: block !important;
            position: static !important;
            height: auto !important;
            min-height: 500px;
            background-color: #000000 !important;
            /* Black Preview Background */
            color: #ffffff !important;
            /* White Preview Text */
            padding: 1rem;
        }

        /* Preview Content Styling */
        .editor-preview-side h1,
        .editor-preview-side h2,
        .editor-preview-side h3 {
            color: #ffffff !important;
            border-bottom: 1px solid #444;
        }

        .editor-preview-side a {
            color: #64b5f6 !important;
        }

        .editor-preview-side pre {
            background: #2d2d2d !important;
            padding: 0.5rem;
            border-radius: 4px;
        }

        .editor-preview-side code {
            background: #2d2d2d !important;
            color: #e0e0e0 !important;
        }

        .editor-preview-side ul,
        .editor-preview-side ol {
            padding-left: 2rem !important;
        }

        /* Ensure container flexes */
        .EasyMDEContainer {
            display: flex;
            flex-wrap: wrap;
        }

        /* Fix toolbar width */
        .editor-toolbar {
            width: 100% !important;
            border-radius: 4px 4px 0 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="/" class="logo">QueueOverflow</a>
            <div class="user-info">
                <span id="user-display" class="user-badge">Guest</span>
            </div>
        </header>

        <main>
            <h2 style="margin-bottom: 2rem;">Create a New Post</h2>

            <form id="create-post-form" class="card">
                <div class="form-group">
                    <label>Title <span style="color:var(--error)">*</span></label>
                    <input type="text" name="title" placeholder="e.g. Best Practices for React Hooks" required>
                </div>

                <div class="form-group editor-container">
                    <label>Content (Markdown Supported)</label>
                    <textarea id="markdown-editor" name="content"></textarea>
                    <small style="color:var(--text-secondary)">Drag and drop images directly into the editor.</small>
                </div>

                <button type="submit" class="btn btn-primary">Publish Post</button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const easyMDE = new EasyMDE({
                element: document.getElementById('markdown-editor'),
                uploadImage: true,
                sideBySideFullscreen: false, // Disable fullscreen for side-by-side
                imageUploadFunction: async (file, onSuccess, onError) => {
                    const formData = new FormData();
                    formData.append('image', file);

                    try {
                        const res = await authFetch('/api/upload', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.url) {
                            onSuccess(data.url);
                        } else {
                            onError(data.error || 'Upload failed');
                        }
                    } catch (err) {
                        onError(err.message);
                    }
                },
                toolbar: [
                    "bold", "italic", "heading", "|",
                    "quote", "unordered-list", "ordered-list", "|",
                    "link", "image", "|",
                    "preview", "side-by-side", "|",
                    "guide"
                ]
            });

            // Force Side-by-Side Mode
            if (!easyMDE.isSideBySideActive()) {
                easyMDE.toggleSideBySide();
            }

            document.getElementById('create-post-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = e.target.title.value;
                const content = easyMDE.value();

                if (!title || !content) {
                    alert("Please fill in all fields");
                    return;
                }

                try {
                    const res = await authFetch('/api/posts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title,
                            content,
                            author_id: currentUser.id
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        window.location.href = `/post.html?id=${data.id}`;
                    } else {
                        alert("Failed to create post");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Error creating post");
                }
            });
        });
    </script>
</body>

</html>
