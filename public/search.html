<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - QueueOverFlow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Fira+Code&display=swap"
        rel="stylesheet">
</head>

<body class="hidden">
    <div class="app-container">
        <!-- Simplified Header -->
        <header class="main-header" style="justify-content: center; border-bottom: none; margin-bottom: 1rem;">
            <div class="search-bar-container" style="width: 100%; max-width: 800px; margin: 0;">
                <input type="text" id="global-search" placeholder="Search error codes, logs, or tags..."
                    autocomplete="off" style="width: 100%;">
                <div id="search-results" class="search-dropdown"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-area">
            <div class="container">
                <div class="page-header">
                    <h2>Search Results for "<span id="search-query-display"></span>"</h2>
                    <a href="/index.html" class="btn btn-secondary">Back to Home</a>
                </div>

                <div id="search-results-list" class="questions-list">
                    <!-- Results injected here -->
                    <div class="loading-spinner">Searching...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const query = params.get('q');

            if (query) {
                document.getElementById('search-query-display').textContent = query;
                document.getElementById('global-search').value = query; // Pre-fill search bar

                try {
                    const res = await authFetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const results = await res.json();

                    const resultsContainer = document.getElementById('search-results-list');

                    if (results.length === 0) {
                        resultsContainer.innerHTML = '<div style="text-align:center; padding:2rem;">No results found.</div>';
                        return;
                    }

                    resultsContainer.innerHTML = results.map(item => {
                        const isPost = item.type === 'post';
                        const link = isPost ? `/post.html?id=${item.id}` : `/question.html?id=${item.id}`;
                        const badge = isPost ? '<span class="tag" style="color:white;">Post</span>' : '<span class="tag" style="color:white;">Question</span>';

                        return `
                <div class="question-item">
                    <div class="stats">
                        <div class="stat-box">
                            <span class="stat-value">${item.relevance_score.toFixed(1)}</span>
                            <span class="stat-label">score</span>
                        </div>
                    </div>
                    <div class="question-content">
                        <h3><a href="${link}">${item.title}</a> ${badge}</h3>
                        <p class="summary">${item.summary || item.content?.substring(0, 150) + '...'}</p>
                        <div class="tags">
                            ${(item.tags || '').split(',').map(t => t.trim() ? `<span class="tag">${t.trim()}</span>` : '').join('')}
                        </div>
                        <div class="meta-info">
                            ${isPost ? 'Posted' : 'Asked'} by <span class="author">${item.author_name}</span> 
                            on ${new Date(item.created_at).toLocaleDateString()}
                        </div>
                    </div>
                </div>
            `}).join('');
                } catch (err) {
                    console.error("Search error:", err);
                    document.getElementById('search-results-list').innerHTML = '<div class="error-state">Error loading results.</div>';
                }
            }
        });
    </script>
</body>

</html>
