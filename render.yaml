services:
  - type: web
    name: queueoverflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueoverflow-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CALLBACK_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: queueoverflow-db
    databaseName: queueoverflow
    user: queueoverflow
    plan: free
